# Serves the built SPA and reverse-proxies the two paths the backend owns.
#
# `backend` is the compose service name. nginx resolves upstream names once, at startup, which is
# why docker-compose.yml makes this container wait for the backend's healthcheck before it starts.
#
# It listens on 8080, not 80: the image runs unprivileged and an unprivileged process cannot bind
# a port below 1024. docker-compose.yml publishes the host port onto this one.
#
# A note on add_header: nginx does NOT merge add_header down into a location that declares one of
# its own - the inherited set is replaced wholesale. So the security headers are declared once at
# server level and no location below adds a header of its own; cache policy is expressed with
# `expires`, which leaves the inherited set alone.

upstream tv_backend {
    server backend:8284;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # There are no uploads here; the largest body the app sends is a chat message, capped at 16 KB.
    client_max_body_size 1m;

    # --- Security headers (server level only - see the note above) ----------------------------
    # `always` so they are set on error responses too, not only on 2xx.
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header X-Frame-Options        "DENY"                             always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # script-src carries no 'unsafe-inline': Vite emits one external module bundle and nothing else.
    # style-src does, because components set the accent colour and the progress-bar width as inline
    # style attributes (CategoryCard.tsx, CategoryLink.tsx, CategoryStage.tsx, NewCategoryDialog.tsx).
    # img-src allows https: because a chat hero proposal renders each candidate straight from the
    # URL the agent found, before anything has been downloaded (HeroCandidates.tsx).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- API ------------------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://tv_backend;
        proxy_http_version 1.1;
        # No Host header is set, so nginx sends its default: the upstream's own name. Forwarding
        # the browser's Host instead would hand the backend a value an attacker controls, and
        # nothing behind here needs to know what name the browser used.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A chat turn is an SSE stream. Buffering it would hold every event back until the turn
        # ended, which defeats the point of streaming it. The app already sends
        # X-Accel-Buffering: no; this is the belt to that braces.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- Card artwork, which the backend mounts from the library's app/heroes -------------------
    location /heroes/ {
        proxy_pass http://tv_backend;
        proxy_http_version 1.1;
    }

    # --- Fingerprinted build output ---------------------------------------------------------
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # --- SPA fallback -------------------------------------------------------------------------
    # `expires -1` emits Cache-Control: no-cache, so a rebuilt bundle is always picked up.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
