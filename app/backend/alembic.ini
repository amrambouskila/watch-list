# Alembic configuration. There is deliberately NO sqlalchemy.url here: alembic/env.py sets it from
# Settings.database_url (or from the test harness), so the password lives in exactly one place and
# never in an ini file. Run from app/backend: `uv run alembic upgrade head`.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
